version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3005:3005"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      # resume.tex is auto-created by the app on first run
      # and synced to your Mac via the .:/app mount above
    command: npm run dev -- -p 3005
    environment:
      - NODE_ENV=development
      - PORT=3005
      # Local mode is enabled so MCP works, but it now supports multiple files!
      - NEXT_PUBLIC_STORAGE_MODE=filesystem
